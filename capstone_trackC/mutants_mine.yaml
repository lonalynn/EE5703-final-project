# mutants_mine.yaml -- bugs WE wrote. The released pool's format.
# To Run:
# python -m craft_mutate.mutate --tb capstone/trojan --sim icarus \
# --pool capstone/trojan/mutants_mine.yaml --dut-dir capstone/trojan
dut: secure_gate_clean.sv
mutants:
# Given by Packet
- id: key_zero_opens
desc: "F1: a second key, all zeros, also unlocks"
find: "assign unlocked = key_ok;"
replace: "assign unlocked = key_ok | (key == 32'd0);"
- id: my_backdoor
desc: "F1: a second key of our own choosing also unlocks (the SPEC.md trojan, with a new key)"
find: "assign unlocked = key_ok;"
replace: "assign unlocked = key_ok | (key == 32'hC0FF_EE00);"
# Mutation 3:
- id: reset_does_not_clear_count
desc: "reset does not clear access_count; the previous count is retained"
find: "if (!rst_n) cnt <= 8'd0;"
replace: "if (!rst_n) cnt <= cnt;"
# Mutation 4:
- id: data_not_passed_when_unlocked
desc: "F2: data_out does not match data_in when the correct key unlocks the gate"
find: "assign data_out = unlocked ? data_in : '0;"
replace: "assign data_out = unlocked ? 8'hFF : '0;"
# Mutation 5:
- id: count_clears_when_locked
desc: "F3: access_count resets to zero instead of retaining its previous value while the gate is locked"
find: "else if (unlocked) cnt <= cnt + 8'd1;"
replace: "else cnt <= 8'd0;"
Mutation 6:
- id: key_compare_high16
desc: "F1: key comparison ignores the lower 16 bits, allowing incorrect keys to unlock"
find: "assign key_ok   = (key == EXPECTED_KEY);"
replace: "assign key_ok   = (key[31:16] == EXPECTED_KEY[31:16]);"


